<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register - Indian Economy News</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-color: #0066cc;
            --brand-hover: #005bb5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-header {
            padding: 30px 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .auth-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .auth-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.03);
            padding: 4px;
            margin: 20px 30px 0;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--brand-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .auth-body {
            padding: 30px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
            color: #0f172a;
        }

        .form-control:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
            background: #ffffff;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--brand-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.25);
        }

        .submit-btn:hover {
            background: var(--brand-hover);
            box-shadow: 0 6px 16px rgba(0, 102, 204, 0.35);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            color: #475569;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        /* Branding footer */
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

<div>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Indian Economy News</h1>
            <p>Macroeconomic Analysis Dashboard</p>
            
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
                <button type="button" class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>
        </div>

        <div class="auth-body">
            <!-- Messages / Alerts -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Login Form -->
            <form action="{% url 'login' %}" method="POST" id="login-form" class="auth-form active">
                {% csrf_token %}
                <input type="hidden" name="action" value="login">
                
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" id="login-username" class="form-control" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" name="remember" id="remember">
                    <label for="remember">Keep me logged in</label>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <!-- Register Form -->
            <form action="{% url 'login' %}" method="POST" id="register-form" class="auth-form">
                {% csrf_token %}
                <input type="hidden" name="action" value="register">

                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" id="reg-username" class="form-control" placeholder="Choose a username" required minlength="4" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="reg-password" class="form-control" placeholder="Create a password" required minlength="6" autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="confirm_password" id="reg-confirm" class="form-control" placeholder="Repeat your password" required minlength="6" autocomplete="new-password">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" name="is_admin" id="is_admin">
                    <label for="is_admin">Register as Admin (Analyst)</label>
                </div>

                <button type="submit" class="submit-btn" style="background: #0f172a; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);">Create Account</button>
            </form>
        </div>
    </div>
    
    <div class="auth-footer">
        &copy; 2026 Indian Economy News Portal. Powered by Ollama & Django.
    </div>
</div>

<script>
    function switchTab(tab) {
        // Form active states
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const tabs = document.querySelectorAll('.tab-btn');

        if (tab === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
        } else {
            loginForm.classList.remove('active');
            registerForm.classList.add('active');
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
        }
    }

    // Auto switch to register tab if there was a register error
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'register') {
            switchTab('register');
        }
    });
</script>
</body>
</html>
